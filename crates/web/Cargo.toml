[package]
name = "jozef-portfolio"
version.workspace = true
repository.workspace = true
description.workspace = true
edition.workspace = true
keywords = ["wasm", "web", "yew"]
categories = ["wasm", "web-programming"]

[dependencies]
animato = "1.7.3"
js-sys = "0.3"
log = "0.4"
wasm-logger = "0.2"
yew = { version = "0.23", features = ["csr"] }
yew-router = "0.20"
serde = { version = "1", features = ["derive"] }
futures = "0.3"
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
gloo = { version = "0.12", features = ["net", "utils", "timers", "render", "events"] }
web-sys = { version = "0.3", features = ["Window", "Location", "Document", "Element", "Storage", "HtmlSelectElement", "MediaQueryList", "Performance", "PointerEvent", "HtmlElement", "Node", "NodeList", "HtmlCanvasElement", "CanvasRenderingContext2d", "CanvasGradient", "DomRect"] }
yew_icons = { version = "0.10", features = ["lucide", "simple_icons"] }
thiserror = "2.0.21"

serde_json = "1"
